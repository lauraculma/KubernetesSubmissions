apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster-dep
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: broadcaster:v1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: "nats://nats-svc:4222"
            # Opcional: Si tienes URL de webhook de Discord/Slack, colócala aquí:
            - name: WEBHOOK_URL
              value: "https://httpbin.org/post"
