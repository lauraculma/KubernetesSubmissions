apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-project-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/lauraculma/KubernetesSubmissions.git'
    targetRevision: main
    path: the_project/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
