apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-wikipedia-cronjob
  namespace: project
spec:
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: random-wiki-todo
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  WIKI_URL=$(curl -s -I -L -w "%{url_effective}" -o /dev/null https://en.wikipedia.org/wiki/Special:Random)
                  TODO_TEXT="Read $WIKI_URL"
                  echo "Found article: $TODO_TEXT"
                  curl -X POST http://todo-backend-svc:5000/todos \
                    -H "Content-Type: application/json" \
                    -d "{\"todo\":\"$TODO_TEXT\"}"
