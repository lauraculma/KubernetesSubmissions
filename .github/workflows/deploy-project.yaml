name: Release and Deploy Branch Environments

on:
  push:
    branches:
      - '*'
    paths:
      - 'the_project/**'
      - 'todo-backend/**'
      - 'project-manifests/**'
      - '.github/workflows/deploy-project.yaml'

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Branch Name and Set Namespace
        id: extract_env
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}
          # Si la rama es main, el namespace debe ser 'project'
          if [ "$BRANCH_NAME" = "main" ]; then
            NAMESPACE="project"
          else
            # Reemplazar barras diagonales y caracteres no válidos por guiones
            NAMESPACE=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          fi
          echo "target_namespace=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "Target namespace is: $NAMESPACE"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./todo-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./the_project
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/the-project:${{ github.sha }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Images and Namespace with Kustomize
        run: |
          cd project-manifests/overlays/prod
          kustomize edit set namespace ${{ steps.extract_env.outputs.target_namespace }}
          kustomize edit set image todo-backend-image=${{ secrets.DOCKER_USERNAME }}/todo-backend:${{ github.sha }}
          kustomize edit set image the-project-image=${{ secrets.DOCKER_USERNAME }}/the-project:${{ github.sha }}

      - name: Validate Generated Manifests
        run: |
          kustomize build project-manifests/overlays/prod
